  <script>
  (function () {
    var paths = Array.prototype.slice.call(document.querySelectorAll("path.letter"));
    var pencil = document.getElementById("pencil");
    if (!paths.length) return;

    var lengths = paths.map(function (p) { return p.getTotalLength(); });
    paths.forEach(function (p, i) {
      p.style.strokeDasharray = String(lengths[i]);
      p.style.strokeDashoffset = String(lengths[i]);
      p.classList.add("ready");
    });

    function easeInOut(t) {
      return t * t * (3 - 2 * t);
    }

    var HOLD = 47;
    var penAngle = HOLD;
    var MULTI = { t: 1, b: 1, r: 1, a: 1, d: 1, k: 1, i: 1, "!": 1 };

    function isIntra(fromP, toP) {
      if (fromP.getAttribute("data-ln") !== toP.getAttribute("data-ln")) return false;
      var ch = fromP.getAttribute("data-ch");
      return ch === toP.getAttribute("data-ch") && MULTI[ch];
    }

    function place(path, len, drawn) {
      var t = Math.max(0, Math.min(drawn, len));
      var pt = path.getPointAtLength(t);
      var look = 3.5;
      var a, b;
      if (t + look <= len) {
        a = pt;
        b = path.getPointAtLength(Math.min(len, t + look));
      } else {
        a = path.getPointAtLength(Math.max(0, t - look));
        b = pt;
      }
      var dx = b.x - a.x;
      var dy = b.y - a.y;
      var horiz = dx / (Math.abs(dx) + Math.abs(dy) + 0.001);
      var target = HOLD + horiz * 4;
      if (target < 40) target = 40;
      if (target > 55) target = 55;
      penAngle += (target - penAngle) * 0.09;
      pencil.setAttribute("transform", "translate(" + pt.x + " " + pt.y + ") rotate(" + penAngle + ")");
    }

    function finish() {
      var last = paths[paths.length - 1];
      place(last, lengths[lengths.length - 1], lengths[lengths.length - 1]);
      pencil.style.transition = "opacity 0.8s ease";
      pencil.style.opacity = "0";
    }

    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      paths.forEach(function (p) { p.style.strokeDashoffset = "0"; });
      pencil.style.opacity = "0";
      finish();
      return;
    }

    var sum = 0;
    for (var n = 0; n < lengths.length; n++) {
      if (!paths[n].getAttribute("data-slow")) sum += lengths[n];
    }
    var SPEED = sum / 4.0;
    pencil.style.opacity = "1";
    place(paths[0], lengths[0], 0);

    function drawStroke(idx) {
      var path = paths[idx];
      var total = lengths[idx];
      var dur = Math.max(125, (total / SPEED) * 1000);
      if (path.getAttribute("data-slow")) dur = Math.max(1000, dur * 1.5);
      var t0 = null;
      function frame(now) {
        if (t0 === null) t0 = now;
        var u = Math.min(1, (now - t0) / dur);
        var drawn = easeInOut(u) * total;
        path.style.strokeDashoffset = String(total - drawn);
        place(path, total, drawn);
        if (u < 1) {
          requestAnimationFrame(frame);
        } else {
          path.style.strokeDashoffset = "0";
          place(path, total, total);
          if (idx + 1 < paths.length) afterStroke(idx);
          else finish();
        }
      }
      requestAnimationFrame(frame);
    }

    function afterStroke(idx) {
      var fromP = paths[idx];
      var toP = paths[idx + 1];
      var pause;
      if (fromP.getAttribute("data-ln") !== toP.getAttribute("data-ln")) pause = 150;
      else if (isIntra(fromP, toP)) pause = 16;
      else pause = 28;
      setTimeout(function () {
        liftTo(idx + 1);
      }, pause);
    }

    function liftTo(nextIdx) {
      var fromP = paths[nextIdx - 1];
      var toP = paths[nextIdx];
      var A = fromP.getPointAtLength(lengths[nextIdx - 1]);
      var B = toP.getPointAtLength(0);
      var dist = Math.hypot(B.x - A.x, B.y - A.y);
      var sameLine = fromP.getAttribute("data-ln") === toP.getAttribute("data-ln");
      var intra = sameLine && isIntra(fromP, toP);
      var ms, hop;
      if (!sameLine) {
        ms = 230;
        hop = 22;
      } else if (intra) {
        ms = 110;
        hop = 6;
      } else {
        ms = 80 + Math.min(46, dist * 0.30);
        hop = Math.min(11, 6 + dist * 0.08);
      }
      var t0 = null;
      function frame(now) {
        if (t0 === null) t0 = now;
        var u = Math.min(1, (now - t0) / ms);
        var s = easeInOut(u);
        var x = A.x + (B.x - A.x) * s;
        var y = A.y + (B.y - A.y) * s - Math.sin(s * Math.PI) * hop;
        penAngle += (HOLD - penAngle) * 0.1;
        pencil.setAttribute("transform", "translate(" + x + " " + y + ") rotate(" + penAngle + ")");
        if (u < 1) requestAnimationFrame(frame);
        else drawStroke(nextIdx);
      }
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(function () { drawStroke(0); });
  })();
  </script>
</body>
</html>
