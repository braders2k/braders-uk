<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>braders.uk — Coming soon</title>
  <meta name="description" content="braders.uk is coming soon. A new site is on its way.">
  <meta property="og:title" content="braders.uk — Coming soon">
  <meta property="og:description" content="braders.uk is coming soon. A new site is on its way.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://braders.uk/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --muted: #9a9a9a;
      --rule: rgba(255, 255, 255, 0.18);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    header, main, footer {
      padding-left: clamp(24px, 6vw, 72px);
      padding-right: clamp(24px, 6vw, 72px);
    }

    header {
      padding-top: clamp(24px, 4vh, 40px);
      display: flex;
      align-items: center;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--fg);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .wordmark .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--fg);
      flex: none;
    }

    main {
      display: flex;
      align-items: center;
    }

    .intro {
      width: 100%;
      max-width: 880px;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: clamp(18px, 3vh, 28px);
    }

    h1 {
      font-size: clamp(40px, 9vw, 96px);
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-wrap: balance;
    }

    .rule {
      width: 48px;
      height: 1px;
      background: var(--rule);
      margin: clamp(24px, 4vh, 40px) 0;
    }

    .sub {
      max-width: 34ch;
      font-size: clamp(16px, 1.4vw, 18px);
      color: var(--muted);
      text-wrap: pretty;
    }

    footer {
      padding-bottom: clamp(24px, 4vh, 40px);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    footer a:hover,
    footer a:focus-visible {
      color: var(--fg);
    }

    .intro > * {
      opacity: 0;
      transform: translateY(8px);
      animation: rise 900ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }
    .intro > :nth-child(1) { animation-delay: 80ms; }
    .intro > :nth-child(2) { animation-delay: 180ms; }
    .intro > :nth-child(3) { animation-delay: 300ms; }
    .intro > :nth-child(4) { animation-delay: 380ms; }

    @keyframes rise {
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro > * { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <header>
    <a class="wordmark" href="/" aria-label="braders.uk home">
      <span class="dot" aria-hidden="true"></span>
      <span>braders.uk</span>
    </a>
  </header>

  <main>
    <div class="intro">
      <p class="eyebrow">Under development</p>
      <h1>Coming soon</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="sub">AI is the future</p>
    </div>
  </main>

  <footer>
    <span>&copy; 2026 braders.uk</span>
    <a href="mailto:simon@braders.uk">simon@braders.uk</a>
  </footer>
</body>
</html>
