      width: min(94vw, 960px);

      stroke-width: 2.35;
      stroke-linecap: round;
      stroke-linejoin: round;

    .vh {

      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .tap-sound {
      position: fixed;
      left: 50%;
      bottom: max(0.85rem, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 2;
      margin: 0;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: #6e5738;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.4s ease, visibility 0.4s ease;

        } catch (eM) {}
      }
      if (htmlAudio) {
        try { htmlAudio.volume = 0; } catch (eV) {}
      }
      requestAnimationFrame(function () { drawStroke(0); });
    }

    function onGesture() {
      var needCreate = !snd || !snd.ctx || snd.ctx.state === "closed";
      ensureSoundFromGesture();
      kickHtmlAudio();
      if (snd && snd.ctx) {
        if (needCreate) playGestureBurst();
        try {
          var p = snd.ctx.resume();
          if (p && typeof p.then === "function") {
            p.then(function () {
              startNoiseSource();
              maybeHideTap();
              if (stroking) scratchOn();
            }).catch(function () {});
          }
        } catch (eR) {}
        startNoiseSource();
        maybeHideTap();
        if (stroking) scratchOn();
      }
      if (writeFinished) replayWrite();
    }

    function drawStroke(idx) {
      var myGen = gen;
      var path = paths[idx];
      var total = lengths[idx];
      var dur = Math.max(125, (total / SPEED) * 1000);
      if (path.getAttribute("data-slow")) dur = Math.max(1000, dur * 1.5);
      var t0 = null;
      var prevDrawn = 0;
      var prevNow = null;
      stroking = true;
      scratchOn();
      function frame(now) {
        if (myGen !== gen) return;
        if (t0 === null) t0 = now;
        var u = Math.min(1, (now - t0) / dur);
        var drawn = easeInOut(u) * total;
        path.style.strokeDashoffset = String(total - drawn);
        place(path, total, drawn);
        if (prevNow !== null) {
          var dt = now - prevNow;
          if (dt > 0) {
            scratchVel(Math.abs(drawn - prevDrawn) / dt / 0.22);
          }
        }
        prevDrawn = drawn;
        prevNow = now;
        if (u < 1) {
          requestAnimationFrame(frame);
        } else {
          path.style.strokeDashoffset = "0";
          place(path, total, total);
          stroking = false;
          scratchOff();
          if (idx + 1 < paths.length) afterStroke(idx, myGen);
          else finish();
        }
      }
      requestAnimationFrame(frame);
    }

    function afterStroke(idx, myGen) {
      var fromP = paths[idx];
      var toP = paths[idx + 1];
      var pause;
      if (fromP.getAttribute("data-ln") !== toP.getAttribute("data-ln")) pause = 150;
      else if (isIntra(fromP, toP)) pause = 16;
      else pause = 28;
      setTimeout(function () {
        if (myGen !== gen) return;
        liftTo(idx + 1, myGen);
      }, pause);
    }

    function liftTo(nextIdx, myGen) {
      var fromP = paths[nextIdx - 1];
      var toP = paths[nextIdx];
      var A = fromP.getPointAtLength(lengths[nextIdx - 1]);
      var B = toP.getPointAtLength(0);
      var dist = Math.hypot(B.x - A.x, B.y - A.y);
      var sameLine = fromP.getAttribute("data-ln") === toP.getAttribute("data-ln");
      var intra = sameLine && isIntra(fromP, toP);
      var ms, hop;
      if (!sameLine) {
        ms = 230;
        hop = 22;
      } else if (intra) {
        ms = 110;
        hop = 6;
      } else {
        ms = 80 + Math.min(46, dist * 0.30);
        hop = Math.min(11, 6 + dist * 0.08);
      }
      var t0 = null;
      function frame(now) {
        if (myGen !== gen) return;
        if (t0 === null) t0 = now;
        var u = Math.min(1, (now - t0) / ms);
        var s = easeInOut(u);
        var x = A.x + (B.x - A.x) * s;
        var y = A.y + (B.y - A.y) * s - Math.sin(s * Math.PI) * hop;
        penAngle += (HOLD - penAngle) * 0.1;
        pencil.setAttribute("transform", "translate(" + x + " " + y + ") rotate(" + penAngle + ")");
        if (u < 1) requestAnimationFrame(frame);
        else drawStroke(nextIdx);
      }
      requestAnimationFrame(frame);
    }

    showTap();
    document.addEventListener("pointerdown", onGesture, { capture: true, passive: true });
    document.addEventListener("touchstart", onGesture, { capture: true, passive: true });
    document.addEventListener("click", onGesture, { capture: true });

    requestAnimationFrame(function () { drawStroke(0); });
  })();
  </script>
</body>
</html>
